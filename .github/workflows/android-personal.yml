name: Android Personal · Debug APK

# Manual test builds only. Release signing keys and automatic publication are not configured here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-personal-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
      FOLIA_BUILD_REPO: Nishino0525Nanase/folia-android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android platforms and build tools
        run: sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.1.0"
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Build frontend and sync Capacitor Android
        run: npm run cap:sync:android
      - name: Build signed debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-personal-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
